# Terminal integration settings
# Mouse wheel scrolls the app instead of tmux
set -g mouse on
# Notifications and progress bar reach the outer terminal
set -g allow-passthrough on
# Distinguish Shift+Enter from Enter (newline in prompt)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# 24-bit color and focus reporting
set -g default-terminal tmux-256color
set -as terminal-features ',xterm*:RGB'
set -g focus-events on

set -g history-limit 100000
set -g renumber-windows on
set -s escape-time 0
set -g display-time 4000
set -g status-interval 5
setw -g aggressive-resize on

# Splits and new windows open in the current directory
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
# prefix+m toggles mouse mode (off = terminal's native selection)
bind m set -g mouse \; display 'mouse #{?mouse,on,off}'
